<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Ludos</title>

    <link rel="stylesheet" href="../assets/css/style.css">

</head>


<body>


<main class="container">


    <aside class="banner">


        <div class="banner__background"></div>


        <nav class="switch" aria-label="Alternar telas">

            <a href="cadastro.html"
                class="switch__button">
                Cadastrar
            </a>
            <a href="login.html"
                class="switch__button switch__button--active"
                aria-current="page">
                Entrar
            </a>

        </nav>

        <section class="banner__content">
            <p class="banner__subtitle">Aqui você encontra</p>
            <h1>Seu boneco Pixar perfeito</h1>
        </section>

    </aside>

    <section class="auth">
        <img
            src="../assets/images/logo.png"
            alt="Logo Ludos"
            class="logo">

        <h2>Bem-vindo de volta!</h2>
        <p class="description">Por favor, insira suas informações</p>

        <form id="login-form">
            
            <div class="input-group">
                <label for="email" class="sr-only">
                    Email
                </label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Digite seu email"
                    autocomplete="email">
            </div>
            <small id="erro-email" class="error"></small>

            <div class="input-group">
                <label for="senha" class="sr-only">
                    Senha
                </label>
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Crie uma senha"
                    autocomplete="new-password">
            </div>
            <p class="footer-link"><a href="esqueciSenha.html">Esqueci minha senha</a></p>

            <small id="erro-senha" class="error"></small>

            <button type="submit">
                Entrar
            </button>
        </form>

        <p class="footer-link">Não possui uma conta? 
            <a href="cadastro.html">Cadastre-se aqui</a>
        </p>

    </section>
</main>
<script type="module" src="../assets/js/login_back.js"></script>
</body>
</html>
