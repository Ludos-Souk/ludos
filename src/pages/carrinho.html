<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho | Ludos</title>
    <link rel="stylesheet" href="../assets/css/home.css">
    <link rel="stylesheet" href="../assets/css/carrinho.css">
</head>
<body id="topo">

    <header class="header sem-banner">
        <h1 class="logo">
            <a href="#topo" aria-label="Voltar ao topo da página inicial">
                <img src="../assets/images/logo_2.png" alt="Logotipo Ludos">
            </a>
        </h1>

        <search class="search-bar">
            <form class="search-form" role="search">
                <label for="search-input" class="sr-only">Buscar Boneco</label>
                <i class="search-icon" data-lucide="search" aria-hidden="true"></i>
                <input type="search" id="search-input" placeholder="Buscar Boneco">
                <button type="button" class="mic-btn" aria-label="Pesquisar por voz">
                    <i data-lucide="mic" aria-hidden="true"></i>
                </button>
            </form>
        </search>

        <nav class="header-icons" aria-label="Menu principal do usuário">
            <ul>
                <li class="filter-wrapper">
                    <button type="button" id="btn-filter" aria-label="Abrir menu de filtros" aria-haspopup="menu" aria-expanded="false" aria-controls="filter-popup">
                        <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
                    </button>

                    <section id="filter-popup" class="filter-popup oculto" aria-labelledby="filter-title">
                        <h3 id="filter-title">Filtrar por</h3>
                        <menu class="filter-menu" role="menu">
                            <li role="none"><button type="button" role="menuitem" class="btn-filter-option" data-sort="alfabetica">Ordem alfabética</button></li>
                            <li role="none"><button type="button" role="menuitem" class="btn-filter-option" data-sort="barato">Mais barato</button></li>
                            <li role="none"><button type="button" role="menuitem" class="btn-filter-option" data-sort="caro">Mais caro</button></li>
                            <li role="none"><button type="button" role="menuitem" class="btn-filter-option" data-sort="desconto">Desconto</button></li>
                        </menu>
                    </section>
                </li>
                <li><button aria-label="Acessar meu perfil"><i data-lucide="circle-user" aria-hidden="true"></i></button></li>
                <li><button aria-label="Ver meus favoritos"><i data-lucide="heart" aria-hidden="true"></i></button></li>
                <li><button aria-label="Ver meu carrinho"><i data-lucide="shopping-cart" aria-hidden="true"></i></button></li>
            </ul>
        </nav>

    </header>

    <main class="main-content cart-main-wrapper">
        <span class="content-handle" aria-hidden="true"></span>
        
        <header class="cart-page-header">
            <button class="btn-back-icon" aria-label="Voltar" onclick="history.back()">
                <i data-lucide="arrow-left" aria-hidden="true"></i>
            </button>
            <h2 class="cart-page-title">Meu carrinho</h2>
        </header>

        <section class="cart-layout">
            <section class="cart-items-section">
                
                <header class="select-all-wrapper">
                    <label class="custom-checkbox-label">
                        <input type="checkbox" id="checkbox-select-all" class="sr-only">
                        <span class="custom-checkbox">
                            <i data-lucide="check" aria-hidden="true"></i>
                        </span>
                        Selecionar todos os produtos
                    </label>
                </header>

                <section class="cart-grid" id="cart-items-container" aria-label="Lista de produtos no carrinho"></section>
            </section>

            <aside class="cart-summary" aria-label="Resumo do pedido">
                <header class="summary-header">
                    <h3><i data-lucide="file-edit" aria-hidden="true"></i> Resumo do pedido</h3>
                </header>
                
                <dl class="summary-details">
                    <dt>Produtos (<span id="summary-count">0</span>)</dt>
                    <dd id="summary-subtotal">R$ 0,00</dd>
                    
                    <dt>Desconto</dt>
                    <dd id="summary-discount">R$ 0,00</dd>
                    
                    <dt>Chegará em</dt>
                    <dd>5 dias úteis</dd>
                </dl>
                
                <hr class="summary-divider">
                
                <dl class="summary-total">
                    <dt>Total</dt>
                    <dd id="summary-total">R$ 0,00</dd>
                </dl>
                
                <button class="btn-buy btn-continue" type="button">Continuar</button>
            </aside>
        </section>
    </main>

    <footer class="footer-wrapper">
        <section class="footer-grid">
            <section class="footer-col">
                <img src="../assets/images/logo_2.png" alt="Logotipo Ludos" class="footer-logo">
                <h4>INFORMAÇÕES DE CONTATO</h4>
                <address>
                    <p><i data-lucide="mail" aria-hidden="true"></i> ludos.loja@gmail.com</p>
                    <p><i data-lucide="phone" aria-hidden="true"></i> (11) 99250-0693</p>
                </address>
            </section>
            <nav class="footer-col" aria-label="Links Rápidos">
                <h4>LINKS RÁPIDOS</h4>
                <p><a href="#" class="footer-link">Voltar ao início <i class="icon-small" data-lucide="arrow-up-right" aria-hidden="true"></i></a></p>
            </nav>
            <nav class="footer-col" aria-label="Ajuda e Suporte">
                <h4>AJUDA</h4>
                <p><a href="#" class="footer-link">Atendimento ao cliente <i class="icon-small" data-lucide="arrow-up-right" aria-hidden="true"></i></a></p>
            </nav>
        </section>

        <hr class="footer-divider">
        <section class="footer-bottom">
            <p>Política de privacidade &copy; 2026</p>
        </section>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="../routes/router.js"></script>
    <script type="module" src="../assets/js/carrinho.js"></script>
</body>
</html>
