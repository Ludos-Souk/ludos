<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Esqueci minha senha | Ludos</title>

    <link rel="stylesheet" href="../assets/css/style.css">

</head>


<body>


<main class="container">


    <aside class="banner">


        <div class="banner__background"></div>


        <nav class="switch" aria-label="Alternar telas">

            <a href="cadastro.html"
                class="switch__button">
                Cadastrar
            </a>
            <a href="login.html"
                class="switch__button switch__button--active"
                aria-current="page">
                Entrar
            </a>

        </nav>

        <section class="banner__content">
            <p class="banner__subtitle">Aqui você encontra</p>
            <h1>Seu boneco Pixar perfeito</h1>
        </section>

    </aside>

    <section class="auth">
        <img
            src="../assets/images/logo.png"
            alt="Logo Ludos"
            class="logo">

        <h2>Esqueceu sua senha?</h2>
        <p class="description">Não tem problema, digite seu email para resetar sua senha</p>

        <form id="esqueciSenha-form">
            
            <div class="input-group">
                <label for="email" class="sr-only">
                    Email
                </label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Digite seu email"
                    autocomplete="email">
            </div>
            <small id="erro-email" class="error"></small>


            <button type="submit">
                Enviar email
            </button>
        </form>

        <p class="footer-link"><a href="cadastro.html">Cancelar</a></p>

    </section>
</main>
<script type="module" src="../routes/router.js"></script>
<script type="module" src="../assets/js/esqueciSenha.js"></script>
</body>
</html>
