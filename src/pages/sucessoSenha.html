<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha alterada | Ludos</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>


<body>
<main class="container">
    <aside class="banner">
        <div class="banner__background"></div>
        <nav class="switch" aria-label="Alternar telas">

            <a href="cadastro.html"
               class="switch__button switch__button--active"
               aria-current="page">
                Cadastrar
            </a>
            <a href="login.html"
               class="switch__button">
                Entrar
            </a>

        </nav>

        <section class="banner__content">
            <p class="banner__subtitle">Aqui você encontra</p>
            <h1>Seu boneco Pixar perfeito</h1>
        </section>

    </aside>

    <section class="auth">
        <img
            src="../assets/images/logo.png"
            alt="Logo Ludos"
            class="logo">
        <h2>Senha alterada com sucesso!</h2>

        <form id="cadastro-form">
            <button type="submit">
                <a href="cadastro.html" id="button_link">Voltar para login</a> 
            </button>
        </form>

    </section>
