<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resete sua senha | Ludos</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_2.png">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>


<body>
<main class="container">
    <aside class="banner">
        <div class="banner__background"></div>
        <nav class="switch" aria-label="Alternar telas">

            <a href="cadastro.html"
               class="switch__button switch__button--active"
               aria-current="page">
                Cadastrar
            </a>
            <a href="login.html"
               class="switch__button">
                Entrar
            </a>

        </nav>

        <section class="banner__content">
            <p class="banner__subtitle">Aqui você encontra</p>
            <h1>Seu boneco Pixar perfeito</h1>
        </section>

    </aside>

    <section class="auth">
        <img
            src="../assets/images/logo.png"
            alt="Logo Ludos"
            class="logo">
        <h2>Resete sua senha</h2>
        <p class="description">Crie uma nova senha para sua conta</p>

        <form id="resetarSenha-form">
            <div class="input-group">
                <label for="senha" class="sr-only">
                    Senha
                </label>
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Crie uma senha"
                    autocomplete="new-password">
            </div>

            <small id="erro-senha" class="error"></small>

            <div class="input-group">
                <label for="senhaConfirma" class="sr-only">
                    Senha
                </label>
                <input
                    id="senhaConfirma"
                    name="senhaConfirma"
                    type="password"
                    placeholder="Confirmar senha"
                    autocomplete="new-password">
            </div>

            <small id="erro-senhaConfirma" class="error"></small>

            <button type="submit">
                Resetar senha
            </button>
        </form>

    </section>
</main>
<script src="../assets/js/vlibras.js"></script>
<script type="module" src="../routes/router.js"></script>
<script type="module" src="../assets/js/resetarSenha.js"></script>
</body>
</html>
